<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>🎹 PianoAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================ */
    /* Reset & Base                                                  */
    /* ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background: #070712;
      color: #e8e8f8;
      font-family: 'Poppins', -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Starfield background canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    /* ============================================================ */
    /* Top Bar - Glassmorphism                                       */
    /* ============================================================ */
    #top-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      flex-shrink: 0;
      height: 52px;
    }

    #app-title {
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #7fc8ff 0%, #c77dff 50%, #ff6b9d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    #mode-btn {
      touch-action: manipulation;
      background: rgba(255, 255, 255, 0.07);
      color: #b0bce0;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      letter-spacing: 0.6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #mode-btn.active {
      background: linear-gradient(135deg, #2255cc, #7733cc);
      color: #fff;
      border-color: rgba(180, 140, 255, 0.5);
      box-shadow: 0 0 18px rgba(120, 80, 255, 0.45);
    }

    #song-select {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      color: #c8c8e8;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      appearance: none;
    }

    /* Score / streak chips */
    #score-area {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
    }
    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 7px;
      padding: 1px 8px 2px;
      min-width: 38px;
    }
    .stat-label { font-size: 7px; color: rgba(255,255,255,0.35); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 15px; font-weight: 900; line-height: 1.1; }
    #score-val  { color: #ffd93d; }
    #streak-val { color: #ff9f6b; }

    #fps {
      font-size: 10px;
      color: rgba(255,255,255,0.22);
      flex-shrink: 0;
      min-width: 40px;
      text-align: right;
      font-weight: 600;
    }

    /* ============================================================ */
    /* Camera section                                               */
    /* ============================================================ */
    #camera-section {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
      background: #06060f;
    }

    #video { display: none; }

    #camera-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Confetti canvas sits on top */
    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    /* Floating note labels */
    #note-floats {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .float-note {
      position: absolute;
      font-size: 20px;
      font-weight: 900;
      font-family: 'Poppins', sans-serif;
      text-shadow: 0 0 14px currentColor, 0 0 28px currentColor;
      animation: floatUp 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      pointer-events: none;
      white-space: nowrap;
      transform-origin: center bottom;
    }
    @keyframes floatUp {
      0%   { opacity: 1;   transform: translateY(0)    scale(1);    }
      25%  { opacity: 1;   transform: translateY(-18px) scale(1.18); }
      100% { opacity: 0;   transform: translateY(-85px) scale(0.85); }
    }

    /* Flash feedback overlay */
    #flash-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s;
    }

    #no-camera-msg {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255,255,255,0.28);
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
    #no-camera-msg .icon { font-size: 48px; opacity: 0.35; }
    #no-camera-msg strong { color: rgba(255,255,255,0.45); font-size: 16px; }

    /* Song complete overlay */
    #complete-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(4, 4, 18, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      gap: 14px;
      z-index: 20;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #complete-overlay.visible { display: flex; }
    .trophy-emoji { font-size: 60px; animation: bounce 0.7s ease infinite alternate; display: block; }
    @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-14px) rotate(5deg); } }
    #complete-overlay h2 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #ffd700, #ff6b9d, #7fc8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }
    #complete-score-msg { font-size: 14px; color: rgba(255,255,255,0.55); }
    #restart-btn {
      background: linear-gradient(135deg, #2255cc, #7733cc);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 32px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 24px rgba(100, 80, 255, 0.5);
      transition: transform 0.15s;
    }
    #restart-btn:active { transform: scale(0.97); }

    /* ============================================================ */
    /* Learn bar                                                    */
    /* ============================================================ */
    #learn-bar {
      display: none;
      flex-direction: column;
      padding: 6px 14px 5px;
      background: rgba(8, 8, 28, 0.92);
      border-top: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
      gap: 5px;
    }
    #learn-bar.visible { display: flex; }
    .learn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #song-title {
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    #next-note { font-size: 14px; font-weight: 800; color: #6bcb77; flex-shrink: 0; }
    #progress  { font-size: 11px; color: rgba(255,255,255,0.32); flex-shrink: 0; }
    #progress-bar-wrap {
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6bcb77, #4d96ff);
      border-radius: 2px;
      width: 0%;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================================ */
    /* Piano section                                                */
    /* ============================================================ */
    #piano-section {
      flex-shrink: 0;
      height: 185px;
      background: #05050e;
      border-top: 1px solid rgba(255,255,255,0.05);
      position: relative;
      box-shadow: 0 -10px 40px rgba(0, 0, 60, 0.6);
    }
    /* Rainbow accent bar at top of piano */
    #piano-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        #4d96ff44 15%, #c77dff66 35%,
        #ff6b9d66 50%, #ffd93d66 65%,
        #6bcb7744 85%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    #piano-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    @media (max-height: 700px) { #piano-section { height: 150px; } }
    @media (max-height: 550px) { #piano-section { height: 120px; } }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<!-- Animated starfield -->
<canvas id="bg-canvas"></canvas>

<div id="app">

  <!-- Top bar -->
  <div id="top-bar">
    <span id="app-title">🎹 PianoAI</span>
    <button id="mode-btn">PLAY</button>
    <select id="song-select"></select>
    <div id="score-area">
      <div class="stat-chip">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score-val">0</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">Streak</span>
        <span class="stat-value" id="streak-val">0🔥</span>
      </div>
    </div>
    <span id="fps">-- fps</span>
  </div>

  <!-- Camera section -->
  <div id="camera-section">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="camera-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>
    <div id="note-floats"></div>
    <div id="flash-overlay"></div>

    <div id="no-camera-msg">
      <div class="icon">📷</div>
      <strong>Camera not available</strong>
      <p>Allow camera access and reload,<br>or tap / click piano keys below.</p>
    </div>

    <div id="complete-overlay">
      <span class="trophy-emoji">🏆</span>
      <h2>Song Complete!</h2>
      <p id="complete-score-msg"></p>
      <button id="restart-btn">▶ Play Again</button>
    </div>
  </div>

  <!-- Learn progress bar -->
  <div id="learn-bar">
    <div class="learn-row">
      <span id="song-title"></span>
      <span id="next-note"></span>
      <span id="progress"></span>
    </div>
    <div id="progress-bar-wrap">
      <div id="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Piano -->
  <div id="piano-section">
    <canvas id="piano-canvas"></canvas>
  </div>

</div>

<!-- Starfield animation (self-contained) -->
<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  const NOTES  = ['♪','♫','♩','♬'];
  let   particles = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function mkParticle() {
    const isNote = Math.random() < 0.12;
    return {
      x:      Math.random() * (canvas.width  || 400),
      y:      Math.random() * (canvas.height || 800),
      size:   Math.random() * 1.8 + 0.4,
      base:   Math.random() * 0.18 + 0.03,
      speed:  Math.random() * 0.25 + 0.04,
      drift:  (Math.random() - 0.5) * 0.18,
      phase:  Math.random() * Math.PI * 2,
      freq:   Math.random() * 0.018 + 0.004,
      isNote,
      char:   NOTES[Math.floor(Math.random() * NOTES.length)],
      fs:     Math.random() * 11 + 7,
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: 70 }, mkParticle);
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.y     -= p.speed;
      p.x     += p.drift;
      p.phase += p.freq;
      if (p.y < -20) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      const a = p.base * (0.65 + 0.35 * Math.sin(p.phase));
      if (p.isNote) {
        ctx.save();
        ctx.globalAlpha = a * 1.4;
        ctx.fillStyle = '#b87fff';
        ctx.font = `${p.fs}px serif`;
        ctx.fillText(p.char, p.x, p.y);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(130,140,255,${a})`;
        ctx.fill();
      }
    }
    requestAnimationFrame(loop);
  }

  init();
})();
</script>

<!-- MediaPipe CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<!-- App scripts -->
<script src="js/songs.js"></script>
<script src="js/sound.js"></script>
<script src="js/piano.js"></script>
<script src="js/app.js"></script>
</body>
</html>
